# category_specs is now an EXTERNAL dependency (github.com/dzackgarza/category-specs),
# consumed via an editable install (sage -pip install -e ../category-specs). It is
# referenced here by package name, so it resolves against the github-sourced installed
# package — no local path. Its own structural mypy/QC now runs in the category-specs repo.
[sage-mypy-category-plugin]
packages =
    category_specs
roles =
    parent
    element
    subcategory
    morphism
    homset_parent
    homset_element
cache_dir = /home/dzack/research/.cache/sage-mypy-plugin
