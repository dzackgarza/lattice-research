type: sprint-work
idPrefix: sprint
displayName: Sprint Work
displayNamePlural: Sprint Works
icon: bolt
color: "#3b82f6"
modes:
  inline: false
  fullDocument: true
sync:
  mode: shared
  scope: project
fields:
  - name: title
    type: string
    required: true
  - name: status
    type: select
    default: planned
    options:
      - value: planned
        label: Planned
        icon: schedule
      - value: active
        label: Active
        icon: motion_photos_on
        color: "#22c55e"
      - value: blocked
        label: Blocked
        icon: block
        color: "#dc2626"
      - value: review
        label: In Review
        icon: rate_review
        color: "#f59e0b"
      - value: done
        label: Done
        icon: check_circle
  - name: priority
    type: select
    options:
      - value: low
        label: Low
      - value: medium
        label: Medium
      - value: high
        label: High
      - value: critical
        label: Critical
  - name: tags
    type: array
    itemType: string
    displayInline: false
  - name: created
    type: datetime
    displayInline: false
    readOnly: true
  - name: updated
    type: datetime
    displayInline: false
    readOnly: true
roles:
  title: title
  workflowStatus: status
  priority: priority
  tags: tags
