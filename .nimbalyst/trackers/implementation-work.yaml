type: implementation-work
idPrefix: impl
displayName: Implementation Work
displayNamePlural: Implementation Works
icon: construction
color: "#f59e0b"
modes:
  inline: false
  fullDocument: true
sync:
  mode: shared
  scope: project
fields:
  - name: title
    type: string
    required: true
  - name: status
    type: select
    default: to-do
    options:
      - value: to-do
        label: To Do
        icon: circle
      - value: in-progress
        label: In Progress
        icon: motion_photos_on
      - value: blocked
        label: Blocked
        icon: block
        color: "#dc2626"
      - value: ready-for-review
        label: Ready for Review
        icon: rate_review
        color: "#3b82f6"
      - value: done
        label: Done
        icon: check_circle
  - name: priority
    type: select
    options:
      - value: low
        label: Low
      - value: medium
        label: Medium
      - value: high
        label: High
      - value: critical
        label: Critical
  - name: tags
    type: array
    itemType: string
    displayInline: false
  - name: created
    type: datetime
    displayInline: false
    readOnly: true
  - name: updated
    type: datetime
    displayInline: false
    readOnly: true
roles:
  title: title
  workflowStatus: status
  priority: priority
  tags: tags
