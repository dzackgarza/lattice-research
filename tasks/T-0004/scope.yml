# T-0004: scope.yml

allowed_files:
  - tasks/T-0004/implementation/*

allowed_modules:
  - coble_geometry_foundation.sage
  - GAP (via sage -sh gap or direct gap call)
  - theory/gap_orbits.md (reference only)

allowed_outputs:
  - Orbit representatives (as F_2^11 vectors)
  - Orbit sizes
  - Stabilizer sizes
  - Verification that sum of orbit sizes = 528

required_isolation:
  type: worktree
  branch: T-0004-work-v3
  worktree_path: .worktrees/T-0004-work-v3

prohibited:
  - Modifying coble_geometry_foundation.sage
  - Modifying any file outside tasks/T-0004/implementation/
  - Using floating-point arithmetic
  - Hand-rolled BFS/DFS orbit computation — must use GAP Orbits()
  - Hand-rolled group generation via transvections — must use GAP OrthogonalGroup() or GO()
  - Any Sage-only implementation — GAP is required for group and orbit operations
