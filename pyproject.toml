[project]
name = "research"
version = "0.1.0"
requires-python = ">=3.12"
# The category-specs DSL now lives in its own repo, consumed as a dependency (research
# imports `category_specs`). The Sage-backed implementation lattice-impl
# (https://github.com/dzackgarza/lattice-impl) is the architectural backend but is NOT
# declared here yet: research does not import it, and an unused declared dep is a deptry
# DEP002 smell — it is re-added atomically with the first `from lattices`/`sage_patches`
# import in research source. Dev setup = editable install into Sage's Python:
#   sage -pip install -e ../category-specs   (and ../lattice-impl once wired)
dependencies = ["category-specs"]

[tool.uv.sources]
category-specs = { git = "https://github.com/dzackgarza/category-specs.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--durations=20 --durations-min=1.0"
cache_dir = ".cache/pytest"
markers = [
    "slow: marks tests that take more than 2 minutes (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
omit = ["src.bak/*"]

[tool.deptry]
extend_exclude = ["\\.venv", "\\.worktrees", "coble_research_lean", "src.bak", "carat", ".*\\.ipynb"]
ignore_notebooks = true
per_rule_ignores = {DEP001 = ["sage", "ore_algebra", "pydantic"], DEP003 = ["sage"]}

[tool.importlinter]
root_package = "research"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
