[project]
name = "research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--durations=20 --durations-min=1.0"
cache_dir = ".cache/pytest"
markers = [
    "slow: marks tests that take more than 2 minutes (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/external/*"]

[tool.deptry]
extend_exclude = ["\\.venv", "\\.worktrees", "coble_research_lean", "src/external", "src/backends/external", "carat", ".*\\.ipynb"]
ignore_notebooks = true
per_rule_ignores = {DEP001 = ["sage", "ore_algebra", "pydantic"], DEP003 = ["sage"]}

[tool.importlinter]
root_package = "research"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
